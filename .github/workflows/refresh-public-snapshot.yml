name: Refresh public market snapshot

on:
  workflow_dispatch:
  schedule:
    # 15:30 Asia/Taipei — shortly after TWSE close.
    - cron: "30 7 * * 1-5"
    # 06:30 Asia/Taipei — after the U.S. cash session.
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: public-market-snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # Intentionally avoid actions/checkout and actions/setup-python.
      # Some repository Actions policies reject external marketplace actions
      # before a runner is even assigned. This workflow only needs the
      # GitHub-hosted runner's built-in git + Python.
      - name: Check out main without external actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m pip install -r requirements.txt

      - name: Refresh and validate public snapshot
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/refresh_public_snapshot.py

      - name: Verify repository diff
        run: |
          git diff --check
          git status --short

      - name: Commit refreshed snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- data/generated; then
            echo "No public snapshot changes to commit."
            exit 0
          fi

          git config user.name "Market Risk Monitor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/generated
          git commit -m "data: refresh public market snapshot"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
