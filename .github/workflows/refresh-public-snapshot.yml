name: Refresh public market snapshot

on:
  workflow_dispatch:
  schedule:
    # 15:30 Asia/Taipei — shortly after TWSE close.
    - cron: "30 7 * * 1-5"
    # 06:30 Asia/Taipei — after the U.S. cash session.
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: public-market-snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh and validate public snapshot
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/refresh_public_snapshot.py

      - name: Verify repository diff
        run: |
          git diff --check
          git status --short

      - name: Commit refreshed snapshot
        shell: bash
        run: |
          if git diff --quiet -- data/generated; then
            echo "No public snapshot changes to commit."
            exit 0
          fi

          git config user.name "Market Risk Monitor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/generated
          git commit -m "data: refresh public market snapshot"
          git push origin HEAD:main
